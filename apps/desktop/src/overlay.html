<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <link rel="stylesheet" href="ui.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        user-select: none;
      }
      body {
        display: grid;
        place-items: center;
        color: var(--flow-ink);
        font: 600 13px/1.1 var(--flow-font);
      }
      #icon {
        position: relative;
        display: grid;
        place-items: center;
        width: min(240px, 100%);
        height: 40px;
        isolation: isolate;
        pointer-events: none;
        cursor: grab;
        touch-action: none;
        transition:
          opacity var(--motion-slow) var(--ease-exit),
          scale var(--motion-fast) var(--ease-change),
          transform var(--motion-fast) var(--ease-change);
      }
      #icon:hover {
        scale: 1.05;
      }
      #icon:active {
        scale: 0.96;
      }
      #icon.faded {
        scale: 0.9;
        transition:
          opacity var(--motion-slow) var(--ease-exit),
          scale var(--motion-slow) var(--ease-exit);
      }
      #icon.idle {
        opacity: 0.76;
      }
      #icon.idle:hover {
        opacity: 1;
      }
      #icon.faded {
        opacity: 0;
      }
      #icon.dragging {
        cursor: grabbing;
        transform: scale(calc(1 + 0.025 * var(--motion-distance)));
      }

      .pill {
        position: absolute;
        width: var(--pill-width, 40px);
        height: 40px;
        border-radius: var(--flow-radius-float);
        background: var(--flow-glass);
        box-shadow: var(--flow-ring), var(--flow-shadow);
        pointer-events: auto;
        transition: box-shadow var(--motion-base) var(--ease-change);
      }
      #icon.listening .pill {
        box-shadow:
          inset 0 0 0 1px rgb(255 107 90 / 55%),
          var(--flow-shadow);
      }
      #icon.processing .pill {
        box-shadow:
          inset 0 0 0 1px rgb(142 156 255 / 55%),
          var(--flow-shadow);
      }
      #icon.done .pill {
        box-shadow:
          inset 0 0 0 1px rgb(95 208 162 / 65%),
          var(--flow-shadow);
      }
      #icon.error .pill {
        box-shadow:
          inset 0 0 0 1px rgb(255 180 84 / 65%),
          var(--flow-shadow);
      }
      #icon.faded .pill {
        pointer-events: none;
      }

      .glyph {
        position: absolute;
        width: 18px;
        height: 18px;
        opacity: 0;
        transform: translateX(var(--glyph-x, 0px)) scale(calc(1 - 0.12 * var(--motion-distance)));
        transition:
          transform var(--motion-slow) var(--ease-enter),
          opacity var(--motion-fast) var(--ease-change);
      }
      .idle .g-mic,
      .listening .g-bars,
      .processing .g-spin,
      .done .g-check,
      .error .g-warn,
      .reminder .g-bell {
        opacity: 1;
        transform: translateX(var(--glyph-x, 0px)) scale(1);
      }
      #label {
        position: absolute;
        width: max-content;
        max-width: 180px;
        transform: translateX(12px);
        pointer-events: none;
        overflow-wrap: anywhere;
        opacity: 0;
        transition: opacity var(--motion-fast) var(--ease-change);
      }
      .open #label {
        opacity: 1;
      }
      #label .label-in {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
      }
      .reminder #label {
        font-variant-numeric: tabular-nums;
      }
      .open #label .label-in {
        animation: label-in var(--motion-base) var(--ease-enter);
      }
      @keyframes label-in {
        from {
          opacity: 0;
        }
      }

      .reminder .pill {
        box-shadow:
          inset 0 0 0 1px var(--flow-red),
          var(--flow-shadow);
      }
      .halo {
        position: absolute;
        width: var(--pill-width, 40px);
        height: 40px;
        border: 1px solid var(--flow-red);
        border-radius: var(--flow-radius-float);
        box-sizing: border-box;
        opacity: 0;
      }
      .halo {
        border-width: 1.5px;
        transition:
          opacity 90ms linear,
          transform 90ms linear;
      }
      .reminder .halo {
        animation: nudge 3.6s var(--ease-change) infinite;
      }
      /* listening: a red ring that swells with your voice (--level is set from the mic) and breathes when quiet */
      .listening .halo {
        border-color: var(--flow-red);
        opacity: calc(0.14 + 0.6 * var(--level, 0));
        transform: scale(calc(1 + 0.14 * var(--level, 0) * var(--motion-distance)));
        animation: breathe 1.8s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          scale: 1;
        }
        50% {
          scale: 1.05;
        }
      }
      /* done and error: one ripple leaves the pill, and the whole pill gives a tiny pop or shake */
      .done .halo,
      .error .halo {
        animation: ripple 720ms var(--ease-enter) both;
      }
      .done .halo {
        border-color: var(--flow-ok);
      }
      .error .halo {
        border-color: var(--flow-warn);
      }
      @keyframes ripple {
        from {
          opacity: 0.55;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(1.4);
        }
      }
      #icon.done {
        animation: pop 420ms var(--ease-enter);
      }
      @keyframes pop {
        from {
          scale: 1;
        }
        35% {
          scale: 1.07;
        }
        to {
          scale: 1;
        }
      }
      #icon.error {
        animation: shake 360ms var(--ease-change);
      }
      @keyframes shake {
        from,
        to {
          translate: 0 0;
        }
        20% {
          translate: -3px 0;
        }
        40% {
          translate: 3px 0;
        }
        60% {
          translate: -2px 0;
        }
        80% {
          translate: 2px 0;
        }
      }
      @keyframes nudge {
        0%,
        100% {
          opacity: 0;
          transform: scale(1);
        }
        18% {
          opacity: 0.42;
        }
        42%,
        99% {
          opacity: 0;
          transform: scale(1.25);
        }
      }
      .g-bell,
      .g-check,
      .g-warn,
      .g-spin {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .g-bell {
        color: var(--flow-red);
      }
      .g-check {
        color: var(--flow-ok);
      }
      .g-warn {
        color: var(--flow-warn);
      }
      .g-bars rect {
        fill: var(--flow-red);
        transform-origin: center;
        transform: scaleY(0.2);
        transition: transform var(--motion-fast) var(--ease-change);
      }
      .g-spin circle {
        color: var(--flow-accent);
        stroke-dasharray: 24 44;
        transform-origin: center;
      }
      /* the arc swings in, then keeps turning for as long as Flow is working */
      .processing .g-spin circle {
        animation:
          turn var(--motion-slow) var(--ease-enter),
          spin 0.9s linear var(--motion-slow) infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .g-check path {
        stroke-dasharray: 20;
        stroke-dashoffset: 20;
      }
      .done .g-check path {
        animation: draw 320ms 70ms var(--ease-enter) forwards;
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes turn {
        from {
          transform: rotate(-135deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        /* Move directly to the final placement while the glyph and label fade. */
        #icon,
        .glyph {
          transition-property: opacity;
        }
        .reminder .halo,
        .listening .halo,
        .done .halo,
        .error .halo,
        #icon.done,
        #icon.error,
        .processing .g-spin circle {
          animation: none;
        }
        .done .halo,
        .error .halo {
          opacity: 0;
        }
        .g-check path {
          stroke-dashoffset: 0;
        }
        .g-bars rect {
          transform: scaleY(0.55);
        }
      }
    </style>
  </head>
  <body>
    <div id="icon" class="idle" title="Flow: drag to move, click for Settings">
      <span class="halo" aria-hidden="true"></span>
      <span class="pill" aria-hidden="true"></span>
      <svg
        aria-hidden="true"
        class="glyph g-mic"
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      >
        <rect x="7" y="2.5" width="6" height="10" rx="3" />
        <path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5" />
      </svg>
      <svg aria-hidden="true" class="glyph g-bars" viewBox="0 0 20 20">
        <rect x="2" y="3" width="3" height="14" rx="1.5" />
        <rect x="6.5" y="3" width="3" height="14" rx="1.5" />
        <rect x="11" y="3" width="3" height="14" rx="1.5" />
        <rect x="15.5" y="3" width="3" height="14" rx="1.5" />
      </svg>
      <svg aria-hidden="true" class="glyph g-spin" viewBox="0 0 20 20">
        <circle cx="10" cy="10" r="7" />
      </svg>
      <svg aria-hidden="true" class="glyph g-check" viewBox="0 0 20 20">
        <path d="M4 10.5l4 4 8-9" />
      </svg>
      <svg aria-hidden="true" class="glyph g-warn" viewBox="0 0 20 20">
        <path d="M10 4v7M10 15.5v.5" />
      </svg>
      <svg aria-hidden="true" class="glyph g-bell" viewBox="0 0 20 20">
        <path d="M5 14V9.5a5 5 0 0 1 10 0V14l1.5 1.5h-13zM8.5 17.5a1.6 1.6 0 0 0 3 0" />
      </svg>
      <span id="label" aria-hidden="true"></span>
    </div>
    <span class="visually-hidden" id="status" role="status" aria-live="polite"></span>
    <script src="overlay.js"></script>
  </body>
</html>
