<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Flow answer</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      /* The card sits against the edge nearest the icon and grows out of it. */
      body {
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        box-sizing: border-box;
        padding: 12px;
        font: 500 14px/1.5 var(--flow-font);
        color: var(--flow-ink);
      }
      body.down {
        align-items: flex-start;
      }

      /* Same glass, ring and shadow as the floating icon; it is only as big as the answer needs. */
      #card {
        box-sizing: border-box;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        width: max-content;
        max-width: 372px;
        padding: 16px 12px 12px 16px;
        position: relative;
        border-radius: var(--flow-radius-float);
        background: var(--flow-glass);
        box-shadow: var(--flow-ring), var(--flow-shadow);
        cursor: grab;
        opacity: 0;
      }
      #card.wide {
        max-width: 560px;
        --flow-mono:
          'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace;
      }
      #card.returning {
        transition:
          transform var(--motion-base) var(--ease-enter),
          opacity var(--motion-base) var(--ease-enter);
      }
      #card.dragging {
        cursor: grabbing;
      }
      #card.in {
        opacity: 1;
      }
      #card.out {
        opacity: 0;
        transform: scale(calc(1 - 0.12 * var(--motion-distance)));
        transition:
          transform var(--motion-base) var(--ease-exit),
          opacity var(--motion-base) var(--ease-exit);
      }
      .grip {
        position: absolute;
        top: 6px;
        left: calc(50% - 11px);
        width: 22px;
        height: 2px;
        border-radius: 2px;
        background: var(--flow-muted);
        opacity: 0.45;
        pointer-events: none;
        transition: opacity var(--motion-fast) var(--ease-change);
      }
      #card:hover .grip {
        opacity: 0.85;
      }
      #card.reminder {
        display: grid;
        min-width: 226px;
        gap: 8px;
      }

      #a {
        flex: 1;
        min-width: 0;
        max-height: 240px;
        overflow-y: auto;
        padding: 3px 4px 3px 0;
        overflow-wrap: anywhere;
        user-select: none;
        font-weight: 400;
      }
      #card.wide #a {
        max-height: 400px;
      }
      #a::-webkit-scrollbar {
        width: 6px;
      }
      #a::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.22);
        border-radius: 3px;
      }
      #a::-webkit-scrollbar-button {
        display: none;
      }
      .prose {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .prose + .code,
      .code + .prose,
      .code + .code {
        margin-top: 8px;
      }
      code.inline {
        padding: 1px 5px;
        border-radius: 5px;
        background: rgb(255 255 255 / 9%);
        font: 12.5px/1.4 var(--flow-mono, Consolas, monospace);
      }
      .code {
        overflow: hidden;
        border-radius: 10px;
        background: rgb(0 0 0 / 28%);
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 8%);
      }
      .code-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 6px 4px 12px;
        background: rgb(255 255 255 / 5%);
      }
      .lang {
        color: var(--flow-muted);
        font-size: 11.5px;
        letter-spacing: 0.02em;
        text-transform: lowercase;
      }
      .code-copy {
        width: auto;
        height: 24px;
        padding: 0 10px;
        border-radius: 6px;
        background: rgb(255 255 255 / 8%);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
      }
      .code-copy.done {
        color: var(--flow-ok);
      }
      pre {
        max-height: 300px;
        margin: 0;
        padding: 10px 12px;
        overflow: auto;
        tab-size: 4;
        white-space: pre;
        font: 12.5px/1.5 var(--flow-mono, Consolas, monospace);
      }
      pre code {
        font: inherit;
      }
      pre::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      pre::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.22);
        border-radius: 3px;
      }
      pre::-webkit-scrollbar-corner {
        background: transparent;
      }
      .tools {
        display: flex;
        flex: none;
        gap: 2px;
        align-self: flex-start;
      }
      #body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #meta {
        display: none;
        padding: 0 0 3px;
        color: var(--flow-muted);
        font-size: 12px;
      }
      /* reminder mode: the text, when it is due, and Snooze / Done; no copy or read aloud */
      .reminder-tools {
        display: none;
        align-items: center;
        gap: 6px;
        justify-self: end;
      }
      #card.reminder .tools.answer-tools {
        display: none;
      }
      #card.reminder .reminder-tools {
        display: flex;
      }
      #card.reminder #meta {
        display: block;
      }
      #card.reminder #a {
        font-weight: 500;
      }
      .pill {
        width: auto;
        height: 32px;
        padding: 0 12px;
        border-radius: var(--flow-radius-control);
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        opacity: 0.9;
        background: rgba(255, 255, 255, 0.08);
      }
      .pill.primary {
        color: #14161a;
        background: var(--flow-ok);
        opacity: 1;
      }
      button {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        padding: 0;
        color: var(--flow-ink);
        background: transparent;
        border: 0;
        border-radius: var(--flow-radius-control);
        opacity: 0.82;
        cursor: pointer;
        transition: opacity var(--motion-fast) var(--ease-change);
      }
      #card:hover button {
        opacity: 0.85;
      }
      button:hover,
      button:focus-visible {
        opacity: 1;
      }
      button:not(.primary):hover {
        background: rgb(255 255 255 / 12%);
      }
      button:focus-visible {
        outline: 2px solid var(--flow-accent);
        outline-offset: 2px;
      }
      button > svg {
        grid-area: 1 / 1;
      }
      svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .done svg {
        stroke: var(--flow-ok);
      }
      .on svg {
        stroke: var(--flow-accent);
      }
      .base,
      .alt {
        transition: opacity var(--motion-fast) var(--ease-change);
      }
      .alt,
      .done .base,
      .on .base {
        opacity: 0;
      }
      .done .alt-done,
      .on .alt-on {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="card" title="Drag to move">
      <span class="grip" aria-hidden="true"></span>
      <div id="body">
        <small id="meta"></small>
        <div id="a" role="status" aria-live="polite" aria-atomic="true" style="margin: 0"></div>
      </div>
      <div class="reminder-tools">
        <button id="snooze" class="pill" type="button" title="Remind me again in 10 minutes">
          Snooze
        </button>
        <button id="done" class="pill primary" type="button" title="Clear this reminder">
          Done
        </button>
      </div>
      <div class="tools answer-tools">
        <button id="copy" type="button" title="Copy" aria-label="Copy the answer">
          <svg aria-hidden="true" class="base" viewBox="0 0 20 20">
            <rect x="7" y="7" width="9" height="9" rx="2" />
            <path
              d="M13 7V5.5A1.5 1.5 0 0 0 11.5 4h-6A1.5 1.5 0 0 0 4 5.5v6A1.5 1.5 0 0 0 5.5 13H7"
            />
          </svg>
          <svg aria-hidden="true" class="alt alt-done" viewBox="0 0 20 20">
            <path d="M4 10.5l4 4 8-9" />
          </svg>
        </button>
        <button id="speak" type="button" title="Read aloud" aria-label="Read the answer aloud">
          <svg aria-hidden="true" class="base" viewBox="0 0 20 20">
            <path d="M3.5 8v4h3l4.5 3.5v-11L6.5 8z" />
            <path d="M14 7.5a3.6 3.6 0 0 1 0 5M16.2 5.5a6.5 6.5 0 0 1 0 9" />
          </svg>
          <svg aria-hidden="true" class="alt alt-on" viewBox="0 0 20 20">
            <rect x="5.5" y="5.5" width="9" height="9" rx="2" />
          </svg>
        </button>
      </div>
    </div>
    <script src="answer.js"></script>
  </body>
</html>
