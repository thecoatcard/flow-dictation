<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Flow answer</title>
    <style>
      :root {
        --ink: #eef0f3;
        --muted: #9aa3ad;
        --glass: #1b1e23;
        --line: #2b3038;
        --accent: #8e9cff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--glass);
        color: var(--ink);
        font:
          14px/1.5 'Segoe UI Variable Text',
          'Segoe UI',
          system-ui,
          sans-serif;
      }
      body {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        padding: 14px 16px 12px;
        border: 1px solid var(--line);
      }
      #q {
        color: var(--muted);
        font-size: 12px;
        margin: 0 0 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #a {
        flex: 1;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        margin: 0;
      }
      .bar {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        padding-top: 10px;
      }
      button {
        font: inherit;
        font-size: 12px;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 4px 12px;
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        border-color: var(--accent);
        outline: none;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #111;
      }
    </style>
  </head>
  <body>
    <p id="q"></p>
    <p id="a" role="status" aria-live="polite"></p>
    <div class="bar">
      <button id="copy" type="button">Copy</button>
      <button id="speak" type="button">Read aloud</button>
      <button id="close" class="primary" type="button">Close</button>
    </div>
    <script src="answer.js"></script>
  </body>
</html>
