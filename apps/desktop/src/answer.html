<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Flow answer</title>
    <style>
      :root {
        --ink: #eef0f3;
        --glass: #1b1e23;
        --busy: #8e9cff;
        --ok: #5fd0a2;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      /* The card sits against the edge nearest the icon and grows out of it. */
      body {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        box-sizing: border-box;
        padding: 6px 0;
        font:
          500 13.5px/1.45 'Segoe UI Variable Text',
          'Segoe UI',
          system-ui,
          sans-serif;
        color: var(--ink);
      }
      body.down {
        align-items: flex-start;
      }

      /* Same glass, ring and shadow as the floating icon; it is only as big as the answer needs. */
      #card {
        box-sizing: border-box;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        width: max-content;
        max-width: 372px;
        padding: 10px 10px 10px 16px;
        border-radius: 20px;
        background: var(--glass);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08) inset,
          0 6px 18px rgba(0, 0, 0, 0.35);
        opacity: 0;
        transform: scale(0.25);
        transition:
          transform 260ms cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 200ms ease-out;
      }
      #card.in {
        opacity: 1;
        transform: scale(1);
      }
      #card.out {
        opacity: 0;
        transform: scale(0.96);
        transition:
          transform 420ms ease-in,
          opacity 420ms ease-in;
      }
      #a {
        flex: 1;
        min-width: 0;
        max-height: 230px;
        overflow-y: auto;
        padding: 3px 4px 3px 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
        font-weight: 400;
      }
      #a::-webkit-scrollbar {
        width: 6px;
      }
      #a::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.22);
        border-radius: 3px;
      }
      #a::-webkit-scrollbar-button {
        display: none;
      }
      .tools {
        display: flex;
        flex: none;
        gap: 2px;
        align-self: flex-start;
      }
      #body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #meta {
        display: none;
        padding: 0 0 3px;
        color: rgba(238, 240, 243, 0.55);
        font-size: 12px;
      }
      /* reminder mode: the text, when it is due, and Snooze / Done; no copy or read aloud */
      .reminder-tools {
        display: none;
        align-items: center;
        gap: 6px;
        align-self: center;
      }
      #card.reminder .tools.answer-tools {
        display: none;
      }
      #card.reminder .reminder-tools {
        display: flex;
      }
      #card.reminder #meta {
        display: block;
      }
      #card.reminder #a {
        font-weight: 500;
      }
      .pill {
        width: auto;
        height: 28px;
        padding: 0 12px;
        border-radius: 14px;
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        opacity: 0.9;
        background: rgba(255, 255, 255, 0.08);
      }
      .pill.primary {
        color: #14161a;
        background: var(--ok);
        opacity: 1;
      }
      button {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        color: var(--ink);
        background: transparent;
        border: 0;
        border-radius: 14px;
        opacity: 0.55;
        cursor: pointer;
        transition:
          opacity 120ms ease-out,
          background 120ms ease-out;
      }
      #card:hover button {
        opacity: 0.85;
      }
      button:hover,
      button:focus-visible {
        opacity: 1 !important;
        background: rgba(255, 255, 255, 0.1);
        outline: none;
      }
      svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .done svg {
        stroke: var(--ok);
      }
      .on svg {
        stroke: var(--busy);
      }
      .alt {
        display: none;
      }
      .done .alt-done,
      .on .alt-on {
        display: block;
      }
      .done .base,
      .on .base {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #card,
        #card.out {
          transition: opacity 120ms linear;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="body">
        <small id="meta"></small>
        <p id="a" role="status" aria-live="polite" style="margin: 0"></p>
      </div>
      <div class="reminder-tools">
        <button id="snooze" class="pill" type="button" title="Remind me again in 10 minutes">Snooze</button>
        <button id="done" class="pill primary" type="button" title="Clear this reminder">Done</button>
      </div>
      <div class="tools answer-tools">
        <button id="copy" type="button" title="Copy" aria-label="Copy the answer">
          <svg class="base" viewBox="0 0 20 20">
            <rect x="7" y="7" width="9" height="9" rx="2" />
            <path d="M13 7V5.5A1.5 1.5 0 0 0 11.5 4h-6A1.5 1.5 0 0 0 4 5.5v6A1.5 1.5 0 0 0 5.5 13H7" />
          </svg>
          <svg class="alt alt-done" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" /></svg>
        </button>
        <button id="speak" type="button" title="Read aloud" aria-label="Read the answer aloud">
          <svg class="base" viewBox="0 0 20 20">
            <path d="M3.5 8v4h3l4.5 3.5v-11L6.5 8z" />
            <path d="M14 7.5a3.6 3.6 0 0 1 0 5M16.2 5.5a6.5 6.5 0 0 1 0 9" />
          </svg>
          <svg class="alt alt-on" viewBox="0 0 20 20">
            <rect x="5.5" y="5.5" width="9" height="9" rx="2" />
          </svg>
        </button>
      </div>
    </div>
    <script src="answer.js"></script>
  </body>
</html>
